{% extends "layout.html" %}

{% block conteudo %}

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Ink & Dreams</h1>
        <p class="auth-subtitle">Entre na sua conta</p>

        <form method="POST">
            <input 
                type="email" 
                name="email"
                placeholder="Digite seu email"
                required>
            <input 
                type="password" 
                name="senha"
                placeholder="Digite sua senha"
                required>
            <button type="submit">Entrar</button>
        </form>

        <p class="auth-link">
            Não tem conta?
            <a href="/cadastro">Cadastre-se</a>
        </p>

    </div>

</div>

{% endblock %}
